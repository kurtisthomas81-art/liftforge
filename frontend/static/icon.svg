<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f04070"/>
      <stop offset="100%" stop-color="#b82040"/>
    </linearGradient>
    <clipPath id="hc">
      <polygon points="50,4 89.84,27 89.84,73 50,96 10.16,73 10.16,27"/>
    </clipPath>
  </defs>

  <!-- Hex body -->
  <polygon points="50,4 89.84,27 89.84,73 50,96 10.16,73 10.16,27" fill="url(#hg)"/>
  <!-- Inner hex ring -->
  <polygon points="50,8.88 85.86,29.56 85.86,70.44 50,91.12 14.14,70.44 14.14,29.56"
